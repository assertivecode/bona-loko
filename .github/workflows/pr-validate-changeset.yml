name: PR Changeset & Path Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  validate-changesets:
    name: Validate Changeset Exact Match
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Changeset Validator
        run: |
          node devops/scripts/changeset-validate.mjs --base origin/${{ github.base_ref }} --head HEAD
